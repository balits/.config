# rust

[[language]]
name = "rust"
auto-format = true
formatter = { command = "rustfmt" }

[language-server.rust-analyzer.config]
check = { command = "clippy" }
cargo = { features = "all" }
lens = { enable = true, implementations = { enable = true } }

[language.debugger]
name = "codelldb"
command = "codelldb"
transport = "tcp"
port-arg = "--port {}"

[[language.debugger.templates]]
name = "binary"
request = "launch"
completion = [ { name = "binary", completion = "filename" } ]
args = { program = "{0}" }
# args = { program = "{0}", initCommands = ["command script import lldb.formatters.attrib_data"] }


# nix

[[language]]
name = "nix"
formatter = { command = "nixftm" }


# laytexch

[[language]]
name = "latex"
scope = "source.tex"
injection-regex = "tex"
file-types = ["tex"]
roots = [".git"]
comment-token = "%"
language-servers = [ "texlab" ]
indent = { tab-width = 4, unit = "\t" }

[language-server.texlab]
command = "texlab"

# pdflatex
 
[language-server.texlab.config.texlab.build]
executable = "pdflatex"
onSave = true
args = [ "-interaction=nonstopmode", "-synctex=1", "%f" ]
 
